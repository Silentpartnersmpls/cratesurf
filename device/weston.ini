[core]
backend=drm-backend.so
idle-time=0
xwayland=false

[shell]
panel-position=none
background-color=0x0e1118

[output]
name=DSI-1
mode=800x1280
transform=rotate-90

[libinput]
enable-tap=true

[keyboard]
# A USB keyboard is a hotpluggable input device like any other: weston picks it up
# through libinput the moment it appears. The keymap is built from xkb-data inside
# the chroot; without these rules weston has no layout to decode scancodes with.
keymap_rules=evdev
keymap_layout=us
repeat-rate=40
repeat-delay=400
