<!doctype html>
<html><head><meta charset="utf-8"><title>download test</title>
<style>
  html,body{margin:0;height:100%;background:#111;color:#eee;font:600 22px system-ui,sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
  button{padding:34px 60px;font:700 26px system-ui,sans-serif;border:0;border-radius:14px;
         background:#ff3d5e;color:#fff}
  #s{font-size:16px;color:#8aa0bb;font-weight:400;text-align:center;max-width:800px}
</style></head>
<body>
  <button id="b">DOWNLOAD TEST FILE</button>
  <div id="s">writes mpc-download-test.wav through the browser's download path</div>
<script>
  document.getElementById('b').onclick = () => {
    // A real 0.5 s 220 Hz WAV, so the MPC could actually import what lands.
    const rate = 44100, n = rate / 2, bytes = new ArrayBuffer(44 + n * 2);
    const v = new DataView(bytes);
    const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    str(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); str(8, 'WAVEfmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
    v.setUint16(32, 2, true); v.setUint16(34, 16, true); str(36, 'data');
    v.setUint32(40, n * 2, true);
    for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.sin(2 * Math.PI * 220 * i / rate) * 12000, true);

    const url = URL.createObjectURL(new Blob([bytes], { type: 'audio/wav' }));
    const a = document.createElement('a');
    a.href = url; a.download = 'mpc-download-test.wav';
    document.body.appendChild(a); a.click(); a.remove();
    document.getElementById('s').textContent = 'download triggered';
  };
</script>
</body></html>
